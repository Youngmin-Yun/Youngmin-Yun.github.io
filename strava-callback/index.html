<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF · Connecting Strava</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
.wordmark{font-size:40px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#0099D6,#6B21A8,#C00063);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
p{color:#9E9E9E;line-height:1.6;max-width:320px}
.spinner{width:32px;height:32px;margin:16px auto;border:3px solid #2A2A2C;border-top-color:#0099D6;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wordmark">WOLF</div>
<div class="spinner" id="sp"></div>
<p id="msg">Returning to the WOLF app…</p>
<script>
var params=new URLSearchParams(window.location.search);
if(params.get('error')){document.getElementById('msg').textContent='Authorization was cancelled. You can close this page and try again.';document.getElementById('sp').style.display='none';}
else if(!params.get('code')){document.getElementById('msg').textContent='Open this page from the WOLF app to connect your Strava account.';document.getElementById('sp').style.display='none';}
</script>
</body>
</html>
