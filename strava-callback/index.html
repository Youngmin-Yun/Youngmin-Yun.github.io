<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WOLF · Connecting Strava</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#121212;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;text-align:center;padding:24px}
.wordmark{font-size:40px;font-weight:700;letter-spacing:2px;background:linear-gradient(90deg,#0099D6,#6B21A8,#C00063);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:24px}
p{color:#9E9E9E;line-height:1.6;max-width:320px}
.btn{margin-top:24px;padding:14px 28px;border-radius:12px;background:linear-gradient(90deg,#0099D6,#6B21A8,#C00063);color:#fff;font-weight:600;text-decoration:none;font-size:16px;display:none}
.spinner{width:32px;height:32px;margin:16px auto;border:3px solid #2A2A2C;border-top-color:#0099D6;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wordmark">WOLF</div>
<div class="spinner" id="sp"></div>
<p id="msg">Connecting your Strava account…</p>
<a id="openBtn" class="btn">Return to WOLF</a>
<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var error = params.get('error');
  var msg = document.getElementById('msg');
  var sp = document.getElementById('sp');
  var btn = document.getElementById('openBtn');
  if (error) {
    msg.textContent = 'Authorization was cancelled. Return to WOLF and try again.';
    sp.style.display = 'none';
    return;
  }
  if (!code) {
    msg.textContent = 'Open this page from the WOLF app to connect Strava.';
    sp.style.display = 'none';
    return;
  }
  var appLink = 'wolf://strava-callback?code=' + encodeURIComponent(code);
  window.location.href = appLink;
  setTimeout(function(){
    sp.style.display = 'none';
    msg.textContent = 'If WOLF did not open automatically, tap below.';
    btn.href = appLink;
    btn.style.display = 'inline-block';
  }, 1500);
})();
</script>
</body>
</html>
